<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KP Jump — настройки</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    select, input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
    .row { margin: 12px 0; }
    code { background: #eee; padding: 2px 5px; border-radius: 4px; word-break: break-all; }
    #status { color: #2a7; margin-left: 10px; }
    .err, #status.err { color: #c33; }
    .hint { font-size: 13px; color: #555; }
    [hidden] { display: none !important; }
    #preview { font-size: 13px; word-break: break-all; }
    button { padding: 8px 18px; }
  </style>
</head>
<body>
  <h1>KP Jump</h1>
  <p>Кнопка на карточке фильма или сериала на Кинопоиске ведёт на выбранный сервис.</p>

  <label for="preset">Куда переходить</label>
  <select id="preset"></select>
  <p id="tplLine">Шаблон ссылки: <code id="tpl"></code></p>

  <div id="customBlock" hidden>
    <label for="customTemplate">Свой шаблон ссылки</label>
    <input type="text" id="customTemplate" placeholder="https://example.com/search?q={title}" spellcheck="false">
    <p class="hint">Можно использовать:<br>
      <code>{title}</code> — название (с годом, если включена опция ниже)<br>
      <code>{year}</code> — год выпуска<br>
      <code>{kp_id}</code> — ID фильма на Кинопоиске<br>
      Значения подставляются в URL-кодировке.</p>
  </div>
  <p id="preview"></p>

  <div class="row"><label><input type="checkbox" id="includeYear"> Добавлять год к названию в поиске</label></div>
  <div class="row"><label><input type="checkbox" id="newTab"> Открывать в новой вкладке</label></div>

  <label for="buttonText">Текст кнопки</label>
  <input type="text" id="buttonText" maxlength="30">

  <p style="margin-top:20px"><button id="save">Сохранить</button><span id="status"></span></p>

  <script src="presets.js"></script>
  <script src="options.js"></script>
</body>
</html>
